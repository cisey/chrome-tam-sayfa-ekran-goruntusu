<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ekran Görüntüsü Önizleme</title>
  <link rel="stylesheet" href="viewer.css" />
</head>
<body>
  <header class="toolbar">
    <div class="meta">
      <img src="icons/icon48.png" alt="Logo" class="logo" />
      <div class="meta-text">
        <h1 id="pageTitle">Yükleniyor...</h1>
        <p id="metaInfo" class="meta-sub">—</p>
      </div>
    </div>

    <div class="controls">
      <div class="zoom-group">
        <button id="fitBtn" class="tool-btn active" title="Ekrana sığdır">Sığdır</button>
        <button id="actualBtn" class="tool-btn" title="Gerçek boyut">%100</button>
      </div>

      <button id="copyBtn" class="tool-btn">Panoya Kopyala</button>
      <button id="downloadPngBtn" class="tool-btn primary">PNG İndir</button>
      <button id="downloadJpgBtn" class="tool-btn">JPEG İndir</button>
    </div>
  </header>

  <div id="warningBanner" class="warning-banner hidden">
    Sayfa tarayıcının maksimum tuval yüksekliğini (32.767 px) aştığı için en üst bölüm yakalandı.
  </div>

  <div id="toast" class="toast hidden"></div>

  <main class="stage">
    <div id="emptyState" class="empty-state hidden">
      Görüntü bulunamadı veya süresi doldu. Yeni bir ekran görüntüsü almak için eklenti simgesine tıklayın.
    </div>
    <img id="previewImage" class="preview-img fit" alt="Tam sayfa ekran görüntüsü" />
  </main>

  <script src="db.js"></script>
  <script src="viewer.js"></script>
</body>
</html>
